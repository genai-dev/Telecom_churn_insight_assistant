[project]
name = "telecom-churn-assistant"
version = "0.1.0"
description = "Evidence-grounded telecom churn retention copilot"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.8,<3", "langgraph>=0.2.60,<2", "streamlit>=1.39,<2", "httpx>=0.27,<1", "python-dotenv>=1,<2"]

[project.optional-dependencies]
llm = ["langchain-ollama>=0.3,<2"]
dev = ["pytest>=8,<10", "ruff>=0.8,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/churn_assistant"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
